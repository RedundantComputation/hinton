<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media — Videos</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="media.css" rel="stylesheet">
</head>
<body>
  <header class="py-3 bg-white border-bottom sticky-top">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0"><a href="./../../" class="text-decoration-none text-dark"><span class="me-2">←</span>Geoffrey E. Hinton</a></h1>
        <span class="text-muted">Media</span>
      </div>
    </div>
  </header>

  <main class="py-4">
    <div class="container">

      <!-- Grid root -->
      <div id="media-root" class="row media-grid g-3" data-type="video" data-placeholder="No thumbnail"></div>

      <!-- Template: thumbnail links out to the video (opens in new tab) -->
      <template id="media-item-tpl">
        <div class="col-lg-4 col-md-6 col-sm-12">
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
              <div class="thumb-wrap mb-3">
                <a class="thumb-link" target="_blank" rel="noopener noreferrer" href="#" aria-label="Open video in new tab">
                  <img class="thumb-img" alt="video thumbnail">
                  <span class="thumb-overlay" aria-hidden="true">▶</span>
                </a>
              </div>
              <h5 class="card-title mb-2"></h5>
              <p class="media-meta mb-3"></p>
            </div>
          </div>
        </div>
      </template>

    </div>
  </main>

  <script src="media.js"></script>
</body>
</html>
