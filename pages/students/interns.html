<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Former Google Interns - Geoffrey Hinton</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bs-primary: #2E446E;
            --bg-color: #7997b9;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
        }

        .header {
            border-bottom: 1px solid #dee2e6;
            background: white !important;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2E446E;
            margin-bottom: 1rem;
        }

        .interns-list {
            list-style: none;
            padding: 0;
        }

        .interns-list li {
            background: white;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            transition: all 0.2s ease;
        }

        .interns-list li:hover {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .intern-name {
            font-weight: 600;
            color: #212529;
            margin-bottom: 0.5rem;
        }

        .intern-name a {
            color: #2E446E;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .intern-name a:hover {
            color: #0a58ca;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header py-3 bg-white sticky-top">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0">
                    <a href="./../../" class="text-decoration-none text-dark">
                        <i class="bi bi-arrow-left me-2"></i>Geoffrey E. Hinton
                    </a>
                </h1>
                <span class="text-muted">Former Google Interns</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <!-- Interns Section -->
            <section id="interns">
                <h2 class="section-title">Former Google Interns</h2>
                <ul class="interns-list">
                    <li>
                        <div class="intern-name">Rishabh Agarwal</div>
                    </li>
                    <li>
                        <div class="intern-name">Ting Chen</div>
                    </li>
                    <li>
                        <div class="intern-name">Boyang Deng</div>
                    </li>
                    <li>
                        <div class="intern-name">Nick Frosst</div>
                    </li>
                    <li>
                        <div class="intern-name">Aidan Gomez</div>
                    </li>
                    <li>
                        <div class="intern-name">Melody Guan</div>
                    </li>
                    <li>
                        <div class="intern-name">Renjie Liao</div>
                    </li>
                    <li>
                        <div class="intern-name">Simon Kornblith</div>
                    </li>
                    <li>
                        <div class="intern-name">Adam Kosiorek</div>
                    </li>
                    <li>
                        <div class="intern-name">Rafael Müller</div>
                    </li>
                    <li>
                        <div class="intern-name">Mengye Ren</div>
                    </li>
                    <li>
                        <div class="intern-name">Yao Qin</div>
                    </li>
                    <li>
                        <div class="intern-name">Sara Sabour</div>
                    </li>
                    <li>
                        <div class="intern-name">Sida Wang</div>
                    </li>
                </ul>
            </section>

        </div>
    </main>
</body>
</html>
